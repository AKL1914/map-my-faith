version: '3.8'

services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile.prod
    container_name: map_my_faith_app
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    volumes:
      - ./laravel-app:/var/www/html
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:alpine
    container_name: map_my_faith_app_nginx
    ports:
      - "80:80"
    volumes:
      - ./laravel-app:/var/www/html
      - ./docker/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: map_my_faith_app_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: map_my_faith_app_redis
    restart: always
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  redis-data:
