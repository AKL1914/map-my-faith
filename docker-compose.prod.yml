version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    container_name: map_my_faith_app
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    volumes:
      - ./laravel-app:/var/www/html
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:alpine
    container_name: map_my_faith_app_nginx
    ports:
      - "80:80"
      - "443:443" # ✅ expose HTTPS too!
    volumes:
      - ./laravel-app:/var/www/html
      - ./docker/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt # ✅ mount host certs into container
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: map_my_faith_app_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: map_my_faith_app_redis
    restart: always
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
