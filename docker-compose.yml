services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile # This is your DEV Dockerfile!
    container_name: map_my_faith_app
    volumes:
      - ./laravel-app:/var/www/html
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:alpine
    container_name: map_my_faith_app_nginx
    ports:
      - "8080:80"
    volumes:
      - ./laravel-app:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: map_my_faith_app_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:alpine
    container_name: map_my_faith_app_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

